# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/jira_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Optional \u2013 can be removed
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=your-very-long-secret-key-here-minimum-256-bits
jwt.expiration=86400000

# Logging (optional but useful)
logging.level.org.springframework.security=DEBUG
jira.base-url=https://your-jira-instance.atlassian.net

